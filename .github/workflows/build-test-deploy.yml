name: Build, Test, Deploy
on:
  push:
  pull_request:

jobs:
  # ---- Unit tests: pure Python, no ROOT/Geant4/Docker (gating) ------------- #
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 floor: writing jagged-string branches with uproot (the test
        # fixtures and the GENIE/Achilles converters do) needs uproot/awkward
        # releases that no longer support 3.9.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gdmltp
        run: pip install -e .[dev]

      - name: Run unit test suite
        run: pytest tests/ -v

      - name: Deprecated g4tp alias still imports
        run: python -c "import warnings; warnings.simplefilter('ignore'); import g4tp; from g4tp import cli, io; from g4tp.backends import genie_convert; print('g4tp shim OK', g4tp.__version__)"

  # ---- Geant4 build + end-to-end integration (gating) --------------------- #
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lawrenceleejr/root-geant4-garfield:cpp17_root-v6-26-10_geant4-v11.4.1_garfield-e0a9f171
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure & build g4sim
        run: |
          mkdir -p build && cd build
          cmake ../g4sim/
          cmake --build .

      - name: Install gdmltp in the container
        # The container's stock pip predates PEP 621 pyproject metadata; upgrade
        # the toolchain first so the install is real (deps included), not a
        # silent UNKNOWN-0.0.0.
        run: |
          python3 -m pip install --no-cache-dir --upgrade pip setuptools wheel
          python3 -m pip install --no-cache-dir -e .
          python3 -c "import gdmltp, numpy, uproot; print('gdmltp', gdmltp.__version__)"

      - name: Run CI macro (direct g4sim)
        run: |
          ldconfig
          ./build/g4sim g4sim/run_ci.mac
          test -f output.root && rm -f output.root

      - name: Run an arb-mode macro (beta spectrum into the Si tracker)
        run: |
          ./build/g4sim macros/betas_silicon_sr90.mac
          test -f output.root && rm -f output.root

      - name: Beam-file replay (/gun/beamFile) smoke
        run: |
          cat > beam.dat << 'EOF'
          # <name|pdg>  x y z [mm]  px py pz [MeV/c]
          e- 0 0 -50 0 0 500
          11 1 0 -50 0 0 500
          2212 -1 0 -50 0 0 500
          EOF
          cat > beam.mac << 'EOF'
          /detector/readGDML gdml/silicon_slab_1mm.gdml
          /run/initialize
          /gun/beamFile beam.dat
          /run/beamOn 3
          EOF
          ./build/g4sim beam.mac
          test -f output.root
          python3 -c "import uproot,sys; n=uproot.open('output.root')['tree'].num_entries; print('events',n); sys.exit(0 if n==3 else 1)"
          rm -f output.root beam.dat beam.mac

      - name: Hand-off event-file smoke (/gun/eventFile)
        run: |
          cat > events.dat << 'EOF'
          # E <nParticles> <vx> <vy> <vz> [mm]; then <pdg> <px> <py> <pz> [MeV/c]
          E 2 0 0 -20
          13 0 0 900
          2212 50 0 300
          E 3 1 0 -20
          13 0 0 700
          211 -30 0 200
          2112 0 20 150
          EOF
          cat > transport.mac << 'EOF'
          /detector/readGDML gdml/liquid_argon_1m3.gdml
          /run/initialize
          /analysis/neutrinoMode off
          /gun/eventFile events.dat
          /run/beamOn 2
          EOF
          ./build/g4sim transport.mac
          test -f output.root
          python3 -c "import uproot,sys; n=uproot.open('output.root')['tree'].num_entries; print('events',n); sys.exit(0 if n==2 else 1)"
          rm -f output.root events.dat transport.mac

      - name: Particle-by-PDG smoke (/gun/particlePDG)
        run: |
          cat > pdg.mac << 'EOF'
          /detector/readGDML gdml/silicon_slab_1mm.gdml
          /run/initialize
          /gun/particlePDG 2212
          /gun/energy 200 MeV
          /gun/position 0 0 -50 mm
          /gun/direction 0 0 1
          /run/beamOn 2
          EOF
          ./build/g4sim pdg.mac
          test -f output.root
          python3 -c "import uproot,sys; t=uproot.open('output.root')['tree']; import numpy as np; pdg=t['primaryPDG'].array(library='np'); print('primaries',pdg.tolist()); sys.exit(0 if (t.num_entries==2 and (pdg==2212).all()) else 1)"
          rm -f output.root pdg.mac

      - name: Integration - YAML config -> macro -> g4sim -> analyze
        # Gating end-to-end check of the whole common frontend against the real
        # engine (gdmltp installed in the container two steps up).
        run: |
          export PATH="$PWD/build:$PATH"
          python3 -m gdmltp run --config examples/water_proton.yaml --local -n 5 -o run_out
          test -f run_out/output.root
          python3 -m gdmltp analyze run_out/output.root -o run_out/analysis
          test -f run_out/analysis/summary.txt
          # Twiss phase-space beam end to end (host samples -> beam.dat -> /gun/beamFile)
          python3 -m gdmltp run --config examples/twiss_muon.yaml --local -n 20 -o twiss_out
          test -f twiss_out/beam.dat
          test -f twiss_out/output.root
          echo "Geant4 YAML + Twiss integration OK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executable
          path: build/g4sim
          retention-days: 1

  # ---- Publish the Geant4 image (gated on both test jobs) ----------------- #
  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-and-test, python-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the Geant4 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/geant4.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
