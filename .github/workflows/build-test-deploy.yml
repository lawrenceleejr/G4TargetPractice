name: Build, Test, Deploy
on:
  push:
  pull_request:

jobs:
  # ---- Unit tests: pure Python, no ROOT/Geant4/Docker (gating) ------------- #
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gdmltp
        run: pip install -e .[dev]

      - name: Run unit test suite
        run: pytest tests/ -v

      - name: Deprecated g4tp alias still imports
        run: python -c "import warnings; warnings.simplefilter('ignore'); import g4tp; from g4tp import cli, io; from g4tp.backends import genie_convert; print('g4tp shim OK', g4tp.__version__)"

  # ---- Geant4 build + end-to-end integration (gating) --------------------- #
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lawrenceleejr/root-geant4-garfield:cpp17_root-v6-26-10_geant4-v11.4.1_garfield-e0a9f171
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure & build g4sim
        run: |
          mkdir -p build && cd build
          cmake ../g4sim/
          cmake --build .

      - name: Run CI macro (direct g4sim)
        run: |
          ldconfig
          ./build/g4sim g4sim/run_ci.mac
          test -f output.root && rm -f output.root

      - name: Run an arb-mode macro (beta spectrum into the Si tracker)
        run: |
          ./build/g4sim macros/betas_silicon_sr90.mac
          test -f output.root && rm -f output.root

      - name: Integration - YAML config -> macro -> g4sim -> analyze
        # Best-effort end-to-end check of the whole common frontend against the
        # real engine. Non-gating because it depends on pip being usable inside
        # the ROOT/Geant4 base image; the gating engine check is the run_ci.mac
        # step above, and the pipeline pieces are covered by the unit suite.
        continue-on-error: true
        run: |
          set -e
          python3 -m ensurepip --upgrade || true
          python3 -m pip install --no-cache-dir -e . || pip3 install --no-cache-dir -e .
          export PATH="$PWD/build:$PATH"
          python3 -m gdmltp run --config examples/water_proton.yaml --local -n 5 -o run_out
          test -f run_out/output.root
          python3 -m gdmltp analyze run_out/output.root -o run_out/analysis
          test -f run_out/analysis/summary.txt
          echo "Geant4 YAML integration OK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executable
          path: build/g4sim
          retention-days: 1

  # ---- Publish the Geant4 image (gated on both test jobs) ----------------- #
  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-and-test, python-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the Geant4 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/geant4.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
