name: Build, Test, Deploy
on:
  push:
  pull_request:

jobs:
  g4tp-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install g4tp
        run: pip install -e .[dev]

      - name: Run test suite
        run: pytest tests/ -v

  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lawrenceleejr/root-geant4-garfield:cpp17_root-v6-26-10_geant4-v11.4.1_garfield-e0a9f171
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake ../g4sim/
          pwd; ls -lrt
      
      - name: Build
        run: |
          cd build
          cmake --build . 
          pwd; ls -lrt
      
      - name: Run executable with input file
        run: |
          pwd; ls -lrt
          ldconfig
          ldd ./build/g4sim
          echo $LD_LIBRARY_PATH
          ./build/g4sim g4sim/run_ci.mac
          pwd; ls -lrt

      - name: Run an arb-mode macro (beta spectrum into the Si tracker)
        run: |
          ./build/g4sim macros/betas_silicon_sr90.mac
          test -f output.root
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executable
          path: build/g4sim
          retention-days: 1

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-and-test, g4tp-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM ghcr.io/lawrenceleejr/root-geant4-garfield:cpp17_root-v6-26-10_geant4-v11.4.1_garfield-e0a9f171
          
          # Set working directory
          WORKDIR /app
          
          # Install Qt6 runtime libraries required by the Geant4 visualization drivers
          RUN apt-get update && apt-get install -y --no-install-recommends \
              libqt6core6 libqt6gui6 libqt6widgets6 libqt6opengl6 \
              && rm -rf /var/lib/apt/lists/*

          # Copy and build
          COPY g4sim/ /app/g4sim/
          RUN mkdir -p /app/build && cd /app/build && cmake /app/g4sim/ && cmake --build .

          # Parameter-scan helper scripts (run with --entrypoint bash)
          COPY scans/ /app/scans/
          RUN if [ -f /usr/lib/x86_64-linux-gnu/libQt5Core.so.5 ]; then strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5; fi
          RUN if [ -f /lib/x86_64-linux-gnu/libQt6Core.so.6 ]; then strip --remove-section=.note.ABI-tag /lib/x86_64-linux-gnu/libQt6Core.so.6; fi

          # g4tp tooling: analysis + event display (uproot/numpy/matplotlib, no ROOT)
          RUN python3 -m pip install --no-cache-dir uproot numpy matplotlib || pip3 install --no-cache-dir uproot numpy matplotlib
          COPY g4tp/ /app/g4tp-src/g4tp/
          COPY pyproject.toml README.md /app/g4tp-src/
          RUN python3 -m pip install --no-cache-dir /app/g4tp-src || pip3 install --no-cache-dir /app/g4tp-src
          COPY g4sim/entrypoint.sh /app/entrypoint.sh
          RUN chmod +x /app/entrypoint.sh

          # Dispatcher entrypoint: 'display|analyze|info' -> g4tp, else -> g4sim
          ENTRYPOINT ["/app/entrypoint.sh"]
          EOF
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max