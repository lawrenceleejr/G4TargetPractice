name: Build GENIE Image
# Separate, NON-GATING workflow: the GENIE image is heavy and its base/tunes/
# splines are version-sensitive, so it is built on its own and does not gate
# merges (the Python + Geant4 jobs in build-test-deploy.yml do). Runs on push
# and on demand; the smoke test is best-effort and continue-on-error until the
# base image + baked splines are pinned.
on:
  push:
    paths:
      - "genie/**"
      - "g4tp/**"
      - "docker/genie.Dockerfile"
      - ".github/workflows/build-genie-deploy.yml"
  workflow_dispatch:
    inputs:
      genie_base:
        description: "GENIE base image"
        required: false
        default: "docker.io/hepstore/genie:master"

env:
  # Default GENIE base; override via workflow_dispatch input.
  GENIE_BASE: ${{ github.event.inputs.genie_base || 'docker.io/hepstore/genie:master' }}

jobs:
  docker-genie:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-genie
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on non-PR) the GENIE image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/genie.Dockerfile
          build-args: |
            GENIE_BASE=${{ env.GENIE_BASE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (best-effort)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          mkdir -p run && cp gdml/liquid_argon_1m3.gdml run/
          cp examples/nu_argon.yaml run/ || true
          # Generate the job spec on the host tool, then run the genie driver.
          docker run --rm -v "$PWD/run":/run -w /run "$IMG" \
            python3 -c "import json;print('genie image OK')"
          echo "Full generation smoke test is enabled once splines are baked in."

      - name: Note build status
        if: steps.build.outcome != 'success'
        run: |
          echo "::warning::GENIE image build did not succeed. This job is non-gating."
          echo "Set a valid GENIE base image (workflow_dispatch input genie_base) and bake splines."
