name: Build Generator Base Images
# Builds GENIE and Achilles FROM SOURCE into dedicated base images, so nobody
# downstream (users or the per-push app-image workflows) ever compiles a
# generator themselves. These are slow builds (GENIE ~2-3 h: Pythia6 + ROOT +
# LHAPDF + GENIE), so they run only when the base recipes change or on manual
# dispatch -- the per-push app images just layer gdmltp on top of the published
# bases. Failures are real failures.
on:
  push:
    paths:
      - "docker/genie-base.Dockerfile"
      - "docker/achilles-base.Dockerfile"
      - ".github/workflows/build-generator-bases.yml"
  workflow_dispatch:
    inputs:
      genie_version:
        description: "GENIE Generator git tag"
        required: false
        default: "R-3_04_02"
      root_version:
        description: "ROOT version for the GENIE base"
        required: false
        default: "6.28.12"
      achilles_ref:
        description: "Achilles git ref"
        required: false
        default: "main"

concurrency:
  group: generator-bases-${{ github.ref }}
  cancel-in-progress: true

env:
  GENIE_VERSION: ${{ github.event.inputs.genie_version || 'R-3_04_02' }}
  ROOT_VERSION: ${{ github.event.inputs.root_version || '6.28.12' }}
  ACHILLES_REF: ${{ github.event.inputs.achilles_ref || 'main' }}

jobs:
  genie-base:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (ROOT + GENIE build needs it)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet \
                      /opt/ghc /usr/local/share/boost || true
          docker system prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-genie-base
          flavor: |
            latest=true
          tags: |
            type=raw,value=${{ env.GENIE_VERSION }}

      - name: Build and push the GENIE base image
        # Registry-backed build cache: the GHA cache backend rejects layers this
        # large (the first run built GENIE fine in ~60 min, then died with
        # "exporting to GitHub Actions Cache: not_found", cancelling the push).
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/genie-base.Dockerfile
          build-args: |
            GENIE_VERSION=${{ env.GENIE_VERSION }}
            ROOT_VERSION=${{ env.ROOT_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/lawrenceleejr/g4targetpractice-genie-base:buildcache
          cache-to: type=registry,ref=ghcr.io/lawrenceleejr/g4targetpractice-genie-base:buildcache,mode=max

  achilles-base:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-achilles-base
          flavor: |
            latest=true
          tags: |
            type=raw,value=${{ env.ACHILLES_REF }}

      - name: Build and push the Achilles base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/achilles-base.Dockerfile
          build-args: |
            ACHILLES_REF=${{ env.ACHILLES_REF }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=achilles-base
          cache-to: type=gha,mode=max,scope=achilles-base
