[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g4tp"
dynamic = ["version"]
description = "G4TargetPractice tooling: run, analyze, compare, and visualize Geant4 simulations (no ROOT needed)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lawrence Lee", email = "llee@utk.edu" }]
keywords = ["geant4", "simulation", "hep", "uproot", "event-display"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["uproot>=5", "awkward>=2", "numpy", "matplotlib", "pyyaml>=5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/lawrenceleejr/G4TargetPractice"
Issues = "https://github.com/lawrenceleejr/G4TargetPractice/issues"

[project.scripts]
g4tp = "g4tp.cli:main"

[tool.setuptools]
packages = ["g4tp", "g4tp.assets", "g4tp.backends"]

[tool.setuptools.dynamic]
version = { attr = "g4tp.__version__" }

[tool.setuptools.package-data]
g4tp = ["assets/*.js", "assets/*.html", "assets/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
