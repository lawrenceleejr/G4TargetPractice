# GENIE backend: a 2 GeV muon-neutrino beam on a liquid-argon target, with the
# final state transported through the argon by Geant4 (the default for every
# generator -- add `transport: false` under `genie:` for a vertex-level run).
#
#   gdmltp run --config examples/nu_argon.yaml -o out       # chains both images
#   # or, from bare Docker (two engines, so two commands):
#   gtp $GENIE  run --config examples/nu_argon.yaml -o out --stage generator
#   gtp $GEANT4 transport -o out
generator: genie

geometry:
  gdml: gdml/liquid_argon_1m3.gdml

beam:
  particle: nu_mu
  energy:
    mode: mono
    value: "2.0 GeV"
  position: "0 0 -50 cm"
  direction: "0 0 1"

run:
  events: 1000
  output: output.root
  seed: 12345

genie:
  tune: G18_10a_00_000
  cross_sections: auto        # auto = splines baked into the genie image
  event_generator_list: Default
  length_units: cm
  target: 1000180400          # optional; else inferred from the GDML material
