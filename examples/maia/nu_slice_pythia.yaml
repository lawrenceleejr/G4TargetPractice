# The MAIA TeV neutrino slice through PYTHIA 8, transported by Geant4.
#
# The point of this config: Pythia 8 does TeV-scale deep-inelastic scattering
# with NO cross-section splines to precompute. The GENIE/HEDIS route to the same
# physics (nu_slice_numu_hedis.yaml) needs a gmkspl step that costs hours on
# tungsten; here the first run starts generating immediately. `transport: true`
# then hands every final-state particle to Geant4, so one output.root carries
# both the interaction record and the full detector response.
#
#   gdmltp run --config examples/maia/nu_slice_pythia.yaml -o slice_pythia
#   gdmltp analyze slice_pythia/output.root
#   gdmltp display slice_pythia/output.root --gdml gdml/MAIA_v0.gdml --events 0:20
#
# THE TRADE-OFF, stated plainly: Pythia collides the neutrino with a single FREE
# NUCLEON -- no nuclear medium, no Fermi motion, no intranuclear cascade. The
# tungsten nozzles are represented by their majority nucleon (W-184 is
# neutron-rich, so a neutron) and the nuclear A-scaling of the rate is NOT
# modelled. What you get is a high-quality TeV shower + hadronization, fast.
# For nuclear effects use the genie (HEDIS) or achilles backends.
generator: pythia

geometry:
  gdml: gdml/MAIA_v0.gdml

beam:
  particle: nu_mu
  # Exact angle-integrated spectrum of neutrinos from in-flight muon decay,
  # E_mu = 5 TeV -> <E_nu> = 0.35 E_mu ~ 1.75 TeV. Pythia is initialized once
  # per distinct sampled energy (the driver groups the rays), so the spectrum
  # costs initializations, not one run per event.
  energy: {mode: mudecay_numu, value: "5 TeV"}
  # The same slice geometry as every other MAIA config: injected from far
  # upstream in z, a multi-meter-wide ribbon in x across the negative-x half,
  # very thin in y, flying downstream (+z) into the detector.
  position:
    x: {dist: uniform, min: "-600 cm", max: "0 cm"}    # multi-meter x spread
    y: {dist: gauss, sigma: "5 mm"}                     # very small y spread
    z: "-2500 cm"                                        # far upstream (~25 m)
  direction:
    central: "0 0 1"                                     # downstream, into MAIA
    xprime: {dist: gauss, sigma: "10 mrad"}              # ring-plane crossing fan
    yprime: {dist: gauss, sigma: "0.1 mrad"}             # keeps the ribbon in y~0

run:
  events: 200
  output: output.root
  seed: 20241420

pythia:
  process: dis               # weak-boson exchange: CC (W) + NC (gamma*/Z)
  target: 1000741840         # W-184 (tungsten nozzles) -> reduced to its majority nucleon
  transport: true            # hand the final state to Geant4 for full transport
  # q2_min: 1.0              # DIS phase-space cut [GeV^2]
  # settings:                # raw Pythia settings, appended last (they win)
  #   - "PDF:pSet = 8"
  #   - "PartonLevel:MPI = off"
  # cmnd: my_card.cmnd       # or supply a verbatim Pythia card
