# Spectrum-only variant: the 10 TeV neutrino-slice energy distribution with a
# fixed vertex, no phase-space painting. Because nothing needs per-event
# sampling, the genie backend maps the muon-decay spectrum to gevgen's native
# functional flux (-f) -- ONE gevgen call for all events instead of one per
# event, so this is the config for large-statistics spectrum/kinematics
# studies (raise run.events freely).
generator: genie

geometry:
  gdml: gdml/MAIA_v0.gdml

beam:
  particle: nu_mu
  energy: {mode: mudecay_numu, value: "5 TeV"}
  # Single fixed source point far upstream (negative x, y = 0, ~25 m back) so
  # this sits in the same slice, but WITHOUT per-event sampling -- that keeps
  # the one-gevgen native-flux path. For the full upstream sheet sampled per
  # event, use nu_slice_numu.yaml.
  position: "-300 0 -2500 cm"
  direction: "0 0 1"

run:
  events: 2000
  output: output.root
  seed: 20241416

genie:
  tune: G18_10a_00_000
  cross_sections: auto
  event_generator_list: Default
  length_units: cm
  target: 1000741840
