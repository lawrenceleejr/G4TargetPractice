# A heavy neutral lepton (HNL) decaying inside the MAIA detector.
#
# The decay is done by GEANT4, not by this framework: the `decay` backend
# hands the particle definition (mass, ctau, channels) to g4sim via /bsm/*
# macro commands, and Geant4's own G4Decay + G4PhaseSpaceDecayChannel fly it,
# decay it in flight, and transport the daughters -- displaced vertex, timing,
# and energy deposits all in ONE Geant4 stage.
#
#   gdmltp run --config examples/maia/hnl_decay.yaml -o hnl
#   gdmltp validate hnl/output.root
#   gdmltp display hnl/output.root --gdml gdml/MAIA_v0.gdml --events 0:20
#
# Lifetime importance sampling: the physical ctau below (1 km) would put
# almost every decay far outside MAIA, so Geant4 GENERATES with ctau_sample
# (10 cm proper -> lab decay length betagamma*ctau ~ 50 m at 500 GeV), and
# after the run each event gets the exact analytic weight back to the true
# ctau in the eventWeight branch. Weight your histograms by it.
#
# Decay distributions are Geant4 phase space (unpolarized). For V-A matrix
# elements / polarization, generate the decays with Pythia8 or MadGraph and
# feed the HepMC3 file in via `generator: external` (see docs/bsm.md).
generator: decay

geometry:
  gdml: gdml/MAIA_v0.gdml

beam:
  pdg: 9900014                 # HNL PDG code (any integer id works everywhere)
  mass: "1.0 GeV"
  energy: {mode: mono, value: "500 GeV"}   # kinetic; any distribution/Twiss works
  position: "0 0 -50 m"        # produced upstream, flying into the detector
  direction: "0 0 1"

decay:
  name: N1                     # Geant4 particle name (cosmetic)
  ctau: "1 km"                 # TRUE proper decay length (or lifetime: "...ns")
  ctau_sample: "10 cm"         # generation value; eventWeight reweights to ctau
  channels:
    - {to: [13, 211], br: 0.6}        # N -> mu- pi+
    - {to: [14, 13, -13], br: 0.4}    # N -> nu_mu mu- mu+ (phase space)

run:
  events: 200
  output: output.root
  seed: 990014
