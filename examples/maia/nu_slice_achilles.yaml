# The MAIA "neutrino slice" through the Achilles generator.
#
# Same spatial slice as nu_slice_numu.yaml -- a ribbon of muon-decay neutrinos
# injected from far upstream in z, spread multiple meters across the negative-x
# half, very thin in y -- but generated with Achilles instead of GENIE, so you
# can compare a theory-driven lepton-nucleus model against GENIE on the SAME
# geometry and beam.
#
#   gdmltp run --config examples/maia/nu_slice_achilles.yaml -o slice_achilles
#   gdmltp analyze slice_achilles/output.root      # nu kinematics panel
#   gdmltp compare slice_hedis/output.root slice_achilles/output.root
#
# TWO DELIBERATE DEVIATIONS from the 10 TeV muon-collider slice, because
# Achilles is a ~GeV-scale generator (quasi-elastic / MEC / RES on light-to-
# medium nuclei), NOT a high-energy DIS code:
#
#  * Energy: the muon-decay spectrum here is for a 5 GeV muon source
#    (<E_nu> ~ 1.75 GeV), which sits squarely in Achilles' regime. The full
#    5 TeV slice is the GENIE/HEDIS job (nu_slice_numu_hedis.yaml); Achilles
#    would be far outside its validity there.
#  * Nucleus: MAIA's interaction rate is dominated by the tungsten nozzles, but
#    Achilles does not model W (Z=74). We use 12C as a representative light
#    nucleus so the example runs; set achilles.nucleus to any Achilles-supported
#    isotope (e.g. 16O, 40Ar, 40Ca) to explore the nuclear dependence.
#
# The interaction is placed at the sampled slice vertex (vertex-only, like the
# GENIE backend). Add `transport: true` under a geant4 hand-off to push the
# final-state particles through the MAIA geometry (see docs/neutrino.md).
generator: achilles

geometry:
  gdml: gdml/MAIA_v0.gdml

beam:
  particle: nu_mu
  # Muon-decay neutrino spectrum for a 5 GeV muon source (Achilles-appropriate
  # energy): dN/dy = 5/3 - 3y^2 + 4/3 y^3, y = E/E_mu, <E> = 0.35 E_mu ~ 1.75 GeV.
  energy: {mode: mudecay_numu, value: "5 GeV"}
  # Identical slice geometry to nu_slice_numu.yaml: injected from far upstream
  # (~25 m back in z), a multi-meter-wide ribbon in x across the negative-x
  # half, very thin in y, flying downstream (+z) into MAIA.
  position:
    x: {dist: uniform, min: "-600 cm", max: "0 cm"}    # multi-meter x spread
    y: {dist: gauss, sigma: "5 mm"}                     # very small y spread
    z: "-2500 cm"                                        # far upstream (~25 m)
  direction:
    central: "0 0 1"                                     # downstream, into MAIA
    xprime: {dist: gauss, sigma: "10 mrad"}              # ring-plane crossing fan
    yprime: {dist: gauss, sigma: "0.1 mrad"}             # keeps the ribbon in y~0

run:
  events: 200
  output: output.root
  seed: 20241419

achilles:
  nucleus: "12C"             # Achilles doesn't model the W nozzles; light-nucleus stand-in
  cascade: true              # intranuclear cascade on final-state hadrons
  # nuclear_model: QESpectral
  # processes: [[13], [14]]  # final-state leptons (default: CC + NC)
